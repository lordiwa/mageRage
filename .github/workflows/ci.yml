name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: gdlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"

      - name: Run gdlint
        run: gdlint scripts/ test/

  test:
    name: GUT tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: false

      - name: Import project (rebuild .godot cache)
        timeout-minutes: 10
        run: godot --headless --path "$PWD" --import

      - name: Run GUT test suite
        run: >-
          godot --headless --path "$PWD"
          -s res://addons/gut/gut_cmdln.gd
          -gdir=res://test -ginclude_subdirs -gexit
